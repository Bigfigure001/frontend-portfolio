<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>weather - app</title>
    <style>
        /* ===== VARIABLES & RESET ===== */
        :root {
            --primary: #6C63FF;
            --secondary: #4A44C6;
            --accent: #FF6584;
            --dark: #2A2D43;
            --light: #F8F9FA;
            --gray: #8C8CA1;
            --shadow: 0 10px 30px rgba(108, 99, 255, 0.15);
            --transition: all 0.3s ease;
            --header-height: 70px;
        }

        html { scroll-behavior: smooth; }

        *{ box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background-image: url('images/weather.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            padding-top: var(--header-height);
        }

        /* ===== HEADER & NAV ===== */
        header {
            background: cadetblue;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 1000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0;
            gap: 1rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1rem;
            align-items: center;
        }

        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 500; position: relative; transition: var(--transition); }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-links a:hover::after { width: 100%; }

        .menu-toggle { display: none; font-size: 1.3rem; cursor: pointer; color: var(--dark); }

        /* ===== MAIN / PROJECT CARD ===== */
        .main-project {
            min-height: calc(100vh - var(--header-height));
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            padding: 2rem 1rem;
        }

        section {
            text-align: center;
            width: 100%;
            max-width: 520px;
            border-radius: 12px;
            /* subtle glass + gradient background */
            background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(245,247,255,0.75) 100%);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 10px 30px rgba(16,24,40,0.08);
            padding: 1.25rem;
        }

        h1 { padding-top: 0.5rem; font-size: 1.6rem; color: #333; }
        h2 { margin: 0.75rem 0 0.5rem; font-size: 1rem; color: #000; }

        /* Form Groups */
        .form-group { margin-bottom: 1.2rem; position: relative; display: flex; flex-direction: column; gap: 0.6rem; }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1.5px solid #e0e6ed;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: #fff;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus { outline: none; border-color: #0984e3; box-shadow: 0 6px 18px rgba(9,132,227,0.08); }

        .form-group textarea { min-height: 120px; resize: vertical; }

        .form-group::before { display: none; }

        ::placeholder { color: #adb5bd; opacity: 1; }

        /* Buttons */
        button { margin-top: 6px; padding: 10px 18px; font-size: 1rem; color: #fff; background-color: #007BFF; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background-color: #0056b3; transform: translateY(-1px); }

        /* Result card */
        .weather-result {
            margin-top: 0.75rem;
            text-align: left;
            display: none;
            gap: 0.5rem;
            align-items: center;
        }

        .weather-result.active { display: flex; }

        .weather-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #ffffff;
            padding: 0.75rem 0.9rem;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            width: 100%;
        }

        .weather-icon { width: 64px; height: 64px; flex: 0 0 64px; }

        .weather-info { flex: 1; }

        .weather-temp { font-size: 1.25rem; font-weight: 700; }

        /* Simple spinner */
        .spinner { width: 18px; height: 18px; border: 3px solid rgba(0,0,0,0.12); border-top-color: #fff; border-radius: 50%; display: inline-block; animation: spin 1s linear infinite; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== MOBILE NAV & RESPONSIVE ADJUSTMENTS ===== */
        @media (max-width: 900px) {
            .nav-links { gap: 0.6rem; }
            .logo { font-size: 1.25rem; }
        }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-links { display: none; position: absolute; top: var(--header-height); right: 0; background: #fff; flex-direction: column; width: 200px; padding: 0.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-radius: 6px; }
            .nav-links.active { display: flex; }
            .nav-links li { width: 100%; }
            .nav-links a { display: block; padding: 0.6rem 0.8rem; }
            section { padding: 1rem; }
        }

        @media (max-width: 480px) {
            .container { padding: 0 0.75rem; }
            section { padding: 0.9rem; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar">
                <a href="#" class="logo">Portfolio</a>
                
                <ul class="nav-links">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                
                <div class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-project">
        <section>
            <h1>Weather App</h1>
            <div class="form-group">
                <h2>Enter Location</h2>
                <input id="location" type="text" placeholder="City, Country" aria-label="City, Country">
                <button id="get-weather" aria-live="polite"><span id="btn-text">Get Weather</span></button>

                <div id="weather-result" class="weather-result" aria-live="polite">
                    <div class="weather-card">
                        <img id="weather-icon" class="weather-icon" src="" alt="weather icon" />
                        <div class="weather-info">
                            <div id="weather-city" class="weather-city"></div>
                            <div id="weather-desc" class="weather-desc"></div>
                        </div>
                        <div id="weather-temp" class="weather-temp"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // -------- Weather interactivity --------
        // Set your OpenWeatherMap API key here to fetch real data.
        // If left blank the app will show simulated sample data.
        const API_KEY = '';

        const input = document.getElementById('location');
        const btn = document.getElementById('get-weather');
        const result = document.getElementById('weather-result');
        const cityEl = document.getElementById('weather-city');
        const descEl = document.getElementById('weather-desc');
        const tempEl = document.getElementById('weather-temp');
        const iconEl = document.getElementById('weather-icon');
        const btnText = document.getElementById('btn-text');

        btn.addEventListener('click', getWeather);
        input.addEventListener('keyup', (e) => { if (e.key === 'Enter') getWeather(); });

        async function getWeather() {
            const q = input.value.trim();
            if (!q) { input.focus(); alert('Please enter a city or location.'); return; }
            setLoading(true);
            try {
                if (API_KEY) {
                    const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(q)}&units=metric&appid=${API_KEY}`;
                    const res = await fetch(url);
                    if (!res.ok) throw res;
                    const data = await res.json();
                    renderWeather(data);
                } else {
                    // simulated data when no API key is provided
                    await new Promise(r => setTimeout(r, 700));
                    const data = {
                        name: q,
                        weather: [{ description: 'Partly cloudy', icon: '03d' }],
                        main: { temp: (Math.random() * 20 + 8).toFixed(1) }
                    };
                    renderWeather(data);
                }
            } catch (err) {
                let msg = 'Could not retrieve weather.';
                if (err && err.status === 404) msg = 'Location not found.';
                if (err && err.status === 401) msg = 'API key invalid. Add a valid OpenWeatherMap API key in the script.';
                alert(msg);
            } finally {
                setLoading(false);
            }
        }

        function renderWeather(data) {
            const desc = data.weather && data.weather[0] ? data.weather[0].description : '';
            const icon = data.weather && data.weather[0] ? data.weather[0].icon : '';
            cityEl.textContent = data.name || '';
            descEl.textContent = desc;
            tempEl.textContent = data.main && data.main.temp !== undefined ? `${Math.round(data.main.temp)}°C` : '';
            if (icon) {
                iconEl.src = `https://openweathermap.org/img/wn/${icon}@2x.png`;
                iconEl.style.display = '';
            } else {
                iconEl.style.display = 'none';
            }
            result.classList.add('active');
        }

        function setLoading(on) {
            if (on) {
                btn.disabled = true;
                btnText.innerHTML = '<span class="spinner"></span>';
            } else {
                btn.disabled = false;
                btnText.textContent = 'Get Weather';
            }
        }
    </script>

    <!-- Floating site navigation FAB -->
    <div id="site-nav-fab">
        <button id="fab-toggle" class="fab" aria-label="Open navigation">☰</button>
        <div id="fab-overlay" class="fab-overlay" hidden>
            <div class="fab-panel" role="dialog" aria-modal="true" aria-label="Site navigation">
                <button id="fab-close" class="fab-close" aria-label="Close">✕</button>
                <h3>Navigate</h3>
                <ul class="fab-list">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="project1.html">Project1</a></li>
                    <li><a href="project2.html">Project2</a></li>
                    <li><a href="project3.html">Project3</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </div>

    <style>
        .fab { position: fixed; right: 16px; bottom: 16px; width: 56px; height: 56px; border-radius: 50%; background: #6C63FF; color: #fff; border: none; box-shadow: 0 6px 18px rgba(0,0,0,0.12); z-index: 2200; font-size: 20px; cursor: pointer; }
        .fab-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 2100; }
        .fab-panel { width: 92%; max-width: 360px; background: #fff; padding: 1rem 1rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
        .fab-close { background: transparent; border: none; font-size: 18px; float: right; cursor: pointer; }
        .fab-list { list-style: none; padding: 0; margin: 0.5rem 0 0 0; display: grid; gap: 0.5rem; }
        .fab-list a { display: block; padding: 0.55rem; border-radius: 8px; text-decoration: none; color: #1f2937; background: #f8fafc; }
        .fab-list a:hover { background: #eef2ff; }
    </style>

    <script>
        (function(){
            const toggle = document.getElementById('fab-toggle');
            const overlay = document.getElementById('fab-overlay');
            const closeBtn = document.getElementById('fab-close');
            toggle && toggle.addEventListener('click', ()=> overlay.hidden = false);
            closeBtn && closeBtn.addEventListener('click', ()=> overlay.hidden = true);
            overlay && overlay.addEventListener('click', (e)=> { if (e.target === overlay) overlay.hidden = true; });
            document.addEventListener('keydown', (e)=> { if (e.key === 'Escape') overlay && (overlay.hidden = true); });
        })();
    </script>
</body>
</html>
